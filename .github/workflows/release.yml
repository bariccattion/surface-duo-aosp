name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency: 
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: echo "RELEASE_TITLE=$(date +'v%Y.%m.%d')" >> $GITHUB_ENV

      - name: Build Image
        run: docker build -f build/Dockerfile -t surface-duo-aosp/treble .

      - name: Build ROM
        run: |
          mkdir -p builds aosp-source
          docker run --rm \
                     --privileged \
                     --name treble \
                     --volume ${{ github.workspace }}/aosp-source:/aosp/source \
                     --volume ${{ github.workspace }}/builds:/aosp/surface-duo-aosp/builds \
                     --volume ${{ github.workspace }}/signing-keys:/aosp/archfx-priv/keys \
                     --volume ${{ github.workspace }}/config/ota.json:/aosp/surface-duo-aosp/config/ota.json \
                     surface-duo-aosp/treble fullbuild

      - name: Upload OTA
        uses: actions/upload-artifact@v4
        with:
          name: ota
          path: config/ota.json

      - name: Upload ROM
        uses: softprops/action-gh-release@v1
        with:
          files: builds/*.xz
          title: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.RELEASE_TITLE }}
          body: "## Changelog\n- ...\n\n## Notes\n- ..."
          draft: true
          prerelease: false

  cleanup:
    needs: build
    runs-on: self-hosted
    if: ${{ always() }}
    steps:
      - name: Cleanup
        run: docker stop treble || true
