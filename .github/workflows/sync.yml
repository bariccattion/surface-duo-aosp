name: Infinity-X-Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  sync-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout duo-de
      uses: actions/checkout@v4

    - name: Checkout Infinity X patches
      uses: actions/checkout@v4
      with:
        repository: Doze-off/patches
        ref: patches-16.2
        path: infinity_patches

    - name: Replace patches
      run: |
        rm -rf ./patches/trebledroid
        cp -R ./infinity_patches/trebledroid ./patches/trebledroid
        rm -rf ./infinity_patches

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit changes
      id: commit_changes
      run: |
        git add .
        if git diff-index --quiet HEAD; then
          echo "No changes to commit"
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          git commit -m "feat: sync with latest Infinity X patches [via Doze-off]"
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      id: create_pr
      uses: peter-evans/create-pull-request@v5
      if: steps.commit_changes.outputs.changes == 'true'
      with:
        commit-message: "feat: sync with latest Infinity X patches [via Doze-off]"
        branch: sync-bot
        base: android-16.2
        title: "Infinity X Patches Sync"
        body: "This PR updates the trebledroid patches from Infinity X (Doze-off/patches patches-16.2 branch). Doze-off and ponces patches are curated manually."
        labels: 'automated-pr'
